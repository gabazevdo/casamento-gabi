<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título principal da aba do navegador (Corrigido) -->
    <title>Gabrielle & Gabriel - Nosso Casamento</title>

    <!-- Descrição geral para o Google -->
    <meta name="description" content="Confira os melhores momentos e baixe as fotos do casamento de Gabrielle e Gabriel.">

    <!-- ========================================== -->
    <!-- META TAGS PARA WHATSAPP E REDES SOCIAIS    -->
    <!-- ========================================== -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Álbum de Casamento - Gabrielle & Gabriel">
    <meta property="og:description" content="Acesse nosso álbum virtual, reviva os melhores momentos da nossa festa e baixe as suas fotos favoritas!">
    
    <!-- IMPORTANTE: O WhatsApp exige o link completo (absoluto) para mostrar a foto -->
    <meta property="og:image" content="https://gabazevdo.github.io/casamento-gabi/fotos/casamento/capa.jpg">
    <meta property="og:url" content="https://gabazevdo.github.io/casamento-gabi/">

    <!-- Ícone da aba do navegador (Favicon) -->
    <link rel="icon" type="image/jpeg" href="fotos/casamento/capa.jpg">

    <link rel="stylesheet" href="style.css">
    <!-- Ícones para os botões -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h1>Gabrielle & Gabriel</h1>
            <p>Casamento Civíl</p>
            <a href="#albums" class="btn-primary">Ver Álbuns</a>
        </div>
    </section>

    <!-- Seção de Álbuns -->
    <section id="albums" class="albums-section">
        <h2>Fotos</h2>
        <div class="album-grid" id="albumGrid">
            <!-- Os cards serão injetados aqui pelo JavaScript -->
        </div>
    </section>

    <!-- Lightbox / Galeria Modal -->
    <div id="galleryModal" class="modal">
        <button class="close-btn" onclick="closeGallery()"><span class="material-icons">close</span></button>
        <div class="modal-content">
            <h3 id="modalTitle">Título do Álbum</h3>
            <div class="photo-grid" id="photoGrid">
                <!-- As fotos do álbum selecionado aparecerão aqui -->
            </div>
        </div>
    </div>

<!-- Visualizador de Foto Única Expandida -->
    <div id="photoViewer" class="viewer">
        <div class="viewer-toolbar">
            <button onclick="closeViewer()"><span class="material-icons">arrow_back</span></button>
            <div class="actions">
                <button onclick="sharePhoto()"><span class="material-icons">share</span></button>
                <a id="downloadBtn" href="#" download><span class="material-icons">download</span></a>
            </div>
        </div>
        
        <!-- ADICIONE ESTAS DUAS LINHAS -->
        <button class="nav-btn prev-btn" onclick="changePhoto(-1)"><span class="material-icons">chevron_left</span></button>
        <button class="nav-btn next-btn" onclick="changePhoto(1)"><span class="material-icons">chevron_right</span></button>
        
        <img id="viewerImage" src="" alt="Foto expandida">
    </div>

    <!-- Seção de Vídeos -->
    <section id="videos" class="videos-section">
        <h2>Vídeo</h2>
        <div class="video-container">
<iframe width="560" height="315" src="https://www.youtube.com/embed/bq05E8ieg6I?si=nHUHFSS0N7KiLvEc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
    </section>

    <!-- Footer -->


<footer>
    <div class="footer-content">
        <h3>Gabriel Foto e Video</h3>

        <p class="footer-contact">
            <a href="mailto:videofotogabriel@gmail.com">
                videofotogabriel@gmail.com
            </a>
            <span>|</span>
            <a href="https://wa.me/5511992359072" target="_blank">
                WhatsApp: (11) 99235-9072
            </a>
        </p>

        <p class="footer-copy">
            &copy; 2026 Gabriel Foto e Video. Todos os direitos reservados.
        </p>
    </div>
</footer>


    <script src="script.js"></script>
</body>
</html>
